name: desktop

# The Windows/Linux Tauri app (apps/desktop + web/apps/desktop + web/apps/overlays), v0.7 (docs/design/next-round.md).
#   windows-latest: unit tests (the ConPTY path of the embedded terminal compiles and runs), NSIS + MSI installers,
#                   size report (NSIS ≤ 25 MB)
#   ubuntu-22.04:   unit tests; tests/flow.rs (projects.py add → migrate → index v2 → review doc → user-ops → .md) and
#                   tests/session.rs (sessions.py dispatch into tmux → attach-cmd → our pty → keystrokes → job status:
#                   the round trip xterm.js makes); deb + rpm + AppImage, size report (deb ≤ 20 MB), and the e2e under
#                   xvfb through tauri-driver (WebKitWebDriver): open a fixture project, search, open an item, edit it →
#                   its Markdown file updated
# Nothing is signed or published: installers and reports are workflow artifacts.
on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "web/apps/desktop/**"
      - "web/apps/overlays/**"
      - "web/packages/**"
      - "web/package.json"
      - "web/pnpm-workspace.yaml"
      - "crates/blurt-capture/**"
      - "skills/blurt/scripts/**"
      - "tests/fixtures/**"
      - "docs/contracts/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "web/apps/desktop/**"
      - "web/apps/overlays/**"
      - "web/packages/**"
      - "web/package.json"
      - "web/pnpm-workspace.yaml"
      - "crates/blurt-capture/**"
      - "skills/blurt/scripts/**"
      - "tests/fixtures/**"
      - "docs/contracts/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis,msi
          - name: linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # pnpm-lock.yaml is not committed (global gitignore): resolve fresh
      PNPM_FLAGS: --no-frozen-lockfile
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Linux packages (Tauri build deps, WebKitWebDriver, xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            patchelf file rpm webkit2gtk-driver xvfb dbus-x11 tmux git

      - name: Install JS dependencies
        run: |
          pnpm -C web install $PNPM_FLAGS
          pnpm -C apps/desktop install $PNPM_FLAGS

      - name: Web tests (desktop UI + overlays)
        run: |
          pnpm -C web --filter @blurt/desktop test
          pnpm -C web --filter @blurt/overlays test

      - name: Frontend build (overlays → desktop/dist/overlays)
        run: |
          pnpm -C web --filter @blurt/overlays build
          pnpm -C web --filter @blurt/desktop build
          test -f web/apps/desktop/dist/overlays/island.html

      - name: Rust lint + tests (index v2, jobs fold, l10n parity, pty, flow, tmux session)
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clippy --all-targets
          cargo test

      - name: Build installers (${{ matrix.bundles }})
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Size report
        run: |
          python apps/desktop/scripts/size_report.py \
            --json size-report-${{ matrix.name }}.json --md size-report-${{ matrix.name }}.md --enforce \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: size-report-${{ matrix.name }}
          path: size-report-${{ matrix.name }}.*
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

      # ---- e2e (Linux): the release binary under xvfb through tauri-driver
      - name: tauri-driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked

      - name: e2e — fixture project, search, open, edit → item .md
        if: runner.os == 'Linux'
        env:
          BLURT_APP: ${{ github.workspace }}/apps/desktop/src-tauri/target/release/blurt
          E2E_SCREENSHOTS: ${{ github.workspace }}/e2e-screenshots
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          NO_AT_BRIDGE: "1"
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" dbus-run-session -- node apps/desktop/e2e/run.mjs

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: e2e-screenshots
          path: e2e-screenshots/
          if-no-files-found: ignore

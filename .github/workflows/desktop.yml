name: desktop

# The Windows/Linux Tauri app (apps/desktop + web/apps/desktop + web/apps/overlays), v0.7 (docs/design/next-round.md).
#   windows-latest: unit tests, NSIS + MSI installers, size report (NSIS ≤ 25 MB)
#   ubuntu-24.04:   unit tests; tests/flow.rs (projects.py add → migrate → index v2 → review doc → user-ops → .md);
#                   deb + rpm + AppImage, size report (deb ≤ 20 MB), and the e2e under
#                   xvfb through tauri-driver (WebKitWebDriver): open a fixture project, search, open an item, edit it →
#                   its Markdown file updated; Settings → Phone → Add Phone… shows the host's pairing QR code
#   both:           crates/blurt-remote (Blurt Remote's host: protocol, server, this OS's backend): clippy + tests, the
#                   golden vectors in tests/remote-vectors among them. Swift and Kotlin check the same vectors: remote.yml
# Nothing is signed or published: installers and reports are workflow artifacts.
on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "web/apps/desktop/**"
      - "web/apps/overlays/**"
      - "web/packages/**"
      - "web/package.json"
      - "web/pnpm-workspace.yaml"
      - "crates/blurt-capture/**"
      - "crates/blurt-remote/**"
      - "tests/remote-vectors/**"
      - "skills/blurt/scripts/**"
      - "tests/fixtures/**"
      - "docs/contracts/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "web/apps/desktop/**"
      - "web/apps/overlays/**"
      - "web/packages/**"
      - "web/package.json"
      - "web/pnpm-workspace.yaml"
      - "crates/blurt-capture/**"
      - "crates/blurt-remote/**"
      - "tests/remote-vectors/**"
      - "skills/blurt/scripts/**"
      - "tests/fixtures/**"
      - "docs/contracts/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    # Windows and Linux run only when the repo variable CROSS_PLATFORM_CI is 'true', or on a manual dispatch (a release's
    # installers: Actions → desktop → Run workflow on the release branch)
    if: vars.CROSS_PLATFORM_CI == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis,msi
          # 24.04, not 22.04: blurt-remote's libspa / pipewire crates need PipeWire ≥ 1.0 headers (22.04 has 0.3.48),
          # so the packages built here need Ubuntu 24.04 or later, Debian 13 or later (glibc 2.39)
          - name: linux
            os: ubuntu-24.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # pnpm-lock.yaml is not committed (global gitignore): resolve fresh
      PNPM_FLAGS: --no-frozen-lockfile
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            crates/blurt-remote

      # Blurt Remote's Linux backend links GStreamer and libpipewire; pipewire-sys / libspa-sys run bindgen (clang +
      # libclang). The plugins are for its encoder test (videotestsrc → x264enc → h264parse → avdec_h264), which
      # skips without them.
      - name: Linux packages (Tauri build deps, WebKitWebDriver, xvfb; GStreamer + PipeWire)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            patchelf file rpm webkit2gtk-driver xvfb dbus-x11 git libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpipewire-0.3-dev clang libclang-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav

      - name: Install JS dependencies
        run: |
          pnpm -C web install $PNPM_FLAGS
          pnpm -C apps/desktop install $PNPM_FLAGS

      - name: Web tests (desktop UI + overlays)
        run: |
          pnpm -C web --filter @blurt/desktop test
          pnpm -C web --filter @blurt/overlays test

      - name: Frontend build (overlays → desktop/dist/overlays)
        run: |
          pnpm -C web --filter @blurt/overlays build
          pnpm -C web --filter @blurt/desktop build
          test -f web/apps/desktop/dist/overlays/island.html

      - name: Blurt Remote host (crates/blurt-remote) lint + tests, the golden vectors among them
        working-directory: crates/blurt-remote
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test -- --test-threads 1

      - name: Rust lint + tests (index v2, jobs fold, l10n parity, flow)
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clippy --all-targets
          cargo test

      - name: Build installers (${{ matrix.bundles }})
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Size report
        env:
          PYTHONIOENCODING: utf-8      # the report prints ≤ / ✓; Windows' console code page can't
        run: |
          python apps/desktop/scripts/size_report.py \
            --json size-report-${{ matrix.name }}.json --md size-report-${{ matrix.name }}.md --enforce \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: size-report-${{ matrix.name }}
          path: size-report-${{ matrix.name }}.*
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

      # ---- e2e (Linux): the release binary under xvfb through tauri-driver
      - name: tauri-driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked

      - name: e2e — fixture project, search, open, edit → item .md; Settings → Phone pairing code
        if: runner.os == 'Linux'
        env:
          BLURT_APP: ${{ github.workspace }}/apps/desktop/src-tauri/target/release/blurt
          E2E_SCREENSHOTS: ${{ github.workspace }}/e2e-screenshots
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          NO_AT_BRIDGE: "1"
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" dbus-run-session -- node apps/desktop/e2e/run.mjs

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: e2e-screenshots
          path: e2e-screenshots/
          if-no-files-found: ignore

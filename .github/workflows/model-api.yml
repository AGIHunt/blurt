name: Model API compatibility

# Run on demand before shipping changes to the model service. Uses temporary directories and fixture models.
on: workflow_dispatch
permissions:
  contents: read

jobs:
  api-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest numpy pillow
      - run: python -m pytest -q tests/test_model_api.py tests/test_model_api_engine.py tests/test_model_api_messages.py tests/test_model_api_native_tools.py

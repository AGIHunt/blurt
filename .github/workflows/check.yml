name: check

# People install the skill straight from main, so main must never be broken: the Python suite (tests/, unittest and
# pytest files alike) runs on every change to the skill or the tests, in a scratch BLURT_HOME (tests/conftest.py; for
# a bare `python -m unittest`, tests/test_0_home.py). Linux + Windows wait for the repo variable CROSS_PLATFORM_CI
# (the smoke job below: those ports are still in development).
on:
  push:
    branches: [main]
    paths: ["skills/**", "tests/**", ".github/workflows/check.yml"]
  pull_request:
    paths: ["skills/**", "tests/**", ".github/workflows/check.yml"]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Syntax
        run: uv run -q python -m compileall -q skills/blurt/scripts tests
      - name: Tests
        # the dependencies the scripts declare (their `# /// script` blocks): tests of the MCP server, of script
        # conversion and of the decoders import them
        run: |
          uv run -q             --with "numpy==2.3.4; python_version >= '3.11'" --with "numpy==2.2.6; python_version < '3.11'"             --with "pillow==12.1.0" --with "sherpa-onnx==1.13.8" --with "opencc-python-reimplemented==0.1.7"             --with "mcp==1.26.0" --with pytest             python -m pytest tests -q -p no:cacheprovider

  smoke:
    # Windows and Linux are still in development: these jobs run only when the repo variable CROSS_PLATFORM_CI is 'true'
    if: vars.CROSS_PLATFORM_CI == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Syntax
        run: uv run -q python -m compileall -q skills/blurt/scripts tests
      - name: Every script starts (resolves its inline deps)
        run: for f in doctor export_local frames items live record review transcribe; do uv run -q skills/blurt/scripts/$f.py --help > /dev/null; done
      - name: Tests
        run: uv run -q --with numpy --with pillow python -m unittest discover -s tests -v

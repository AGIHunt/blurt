name: check

# Cheap smoke check: people install the skill straight from main, so main must never be broken.
# Runs only when the skill or tests change; Linux + Windows (paths, encodings, console code pages differ), ~1 min each.
on:
  push:
    branches: [main]
    paths: ["skills/**", "tests/**", ".github/workflows/check.yml"]
  pull_request:
    paths: ["skills/**", "tests/**", ".github/workflows/check.yml"]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Windows and Linux are still in development: these jobs run only when the repo variable CROSS_PLATFORM_CI is 'true'
    if: vars.CROSS_PLATFORM_CI == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Syntax
        run: uv run -q python -m compileall -q skills/blurt/scripts tests
      - name: Every script starts (resolves its inline deps)
        run: for f in doctor export_local frames items live record review transcribe; do uv run -q skills/blurt/scripts/$f.py --help > /dev/null; done
      - name: Tests
        run: uv run -q --with numpy --with pillow python -m unittest discover -s tests -v

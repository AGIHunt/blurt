name: check

# Cheap smoke check: people install the skill straight from main, so main must never be broken.
# Linux checks script startup; macOS/Windows check the minimum supported Python with stdlib tests.
# Runs only when the skill, tests or this workflow change.
on:
  push:
    branches: [main]
    paths: ["skills/**", "tests/**", ".github/workflows/check.yml"]
  pull_request:
    paths: ["skills/**", "tests/**", ".github/workflows/check.yml"]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.os }} / Python 3.10
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Syntax
        run: python -m compileall -q skills/blurt/scripts tests
      - name: Standard-library tests
        run: python -m unittest discover -s tests -v

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Syntax
        run: python3 -m compileall -q skills/blurt/scripts tests
      - name: Every script starts (resolves its inline deps)
        run: for f in doctor export_local feishu frames record review transcribe; do uv run -q skills/blurt/scripts/$f.py --help > /dev/null; done
      - name: Tests
        run: python3 -m unittest discover -s tests -v

# xcodegen generate  →  BlurtRemote.xcodeproj (not committed)
name: BlurtRemote
options:
  bundleIdPrefix: dev.blurt
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 3SWR56LPUZ
    CODE_SIGN_STYLE: Automatic
packages:
  BlurtMac:
    path: ../../skills/blurt/recorder/macos
targets:
  BlurtRemote:
    type: application
    platform: iOS
    sources:
      - path: BlurtRemote
      - path: Shared
    dependencies:
      - package: BlurtMac
        product: BlurtRemoteKit
      - target: BlurtShare
    entitlements:
      path: BlurtRemote/Resources/BlurtRemote.entitlements
      properties:
        com.apple.security.application-groups: [$(BLURT_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.blurt.remote
        BLURT_APP_GROUP: group.dev.blurt.remote
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: BlurtRemote/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: work.blurt.remote
          BLURT_APP_GROUP: group.work.blurt.remote
  # Share → Blurt (docs/design/remote-files.md): copies what's shared into the App Group's outbox for the app to send
  BlurtShare:
    type: app-extension
    platform: iOS
    sources:
      - path: BlurtShare
      - path: Shared
    entitlements:
      path: BlurtShare/BlurtShare.entitlements
      properties:
        com.apple.security.application-groups: [$(BLURT_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.blurt.remote.share
        BLURT_APP_GROUP: group.dev.blurt.remote
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: BlurtShare/Info.plist
        SUPPORTS_MACCATALYST: NO
      configs:
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: work.blurt.remote.share
          BLURT_APP_GROUP: group.work.blurt.remote
  BlurtRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BlurtRemoteTests
    dependencies:
      - target: BlurtRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BlurtRemote:
    build:
      targets:
        BlurtRemote: all
    test:
      targets:
        - BlurtRemoteTests

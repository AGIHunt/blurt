# xcodegen generate  →  BlurtRemote.xcodeproj (not committed)
name: BlurtRemote
options:
  bundleIdPrefix: dev.blurt
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 3SWR56LPUZ
    CODE_SIGN_STYLE: Automatic
packages:
  BlurtMac:
    path: ../../skills/blurt/recorder/macos
targets:
  BlurtRemote:
    type: application
    platform: iOS
    sources:
      - path: BlurtRemote
    dependencies:
      - package: BlurtMac
        product: BlurtRemoteKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.blurt.remote
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: BlurtRemote/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  BlurtRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BlurtRemoteTests
    dependencies:
      - target: BlurtRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BlurtRemote:
    build:
      targets:
        BlurtRemote: all
    test:
      targets:
        - BlurtRemoteTests

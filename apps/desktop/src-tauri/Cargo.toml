[package]
name = "blurt-desktop"
version = "1.0.15"
description = "Blurt for Windows and Linux: what you say, snap and record becomes work, filed into projects and handed to agents"
authors = ["Blurt"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "blurt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "blurt"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
sha1 = "0.10"
dirs = "6"
sys-locale = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
# record.py ffmpeg engine + overlay windows (picker, island, cards, note)
blurt-capture = { path = "../../../crates/blurt-capture" }
# a snap's strokes burnt into shots/NNN.marked.png (capture/snap.rs)
png = "0.17"
# Blurt on the phone (remote.rs): the host — protocol, pairing, sessions, each OS's screen and input — and the pairing QR code
blurt-remote = { path = "../../../crates/blurt-remote" }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(windows)'.dependencies]
# Dictation (src/dictation): the low-level keyboard hook, SendInput, the clipboard, PlaySound; the mic through WASAPI
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange",
  "Win32_System_Memory", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Media_Audio",
  "Win32_System_Ole", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_Security_Credentials", "Win32_System_Time",
  "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Variant",
  # dictation/insert_win.rs: an app's name as Windows shows it (the exe's FileDescription, in the user's language)
  "Win32_Storage_FileSystem",
  # onboarding.rs: "Open Blurt at login" (HKCU\…\Run) and the microphone's privacy switches
  "Win32_System_Registry",
  # capture/snap.rs: the windows a click in the picker takes (cloaked ones left out, their visible frame)
  "Win32_Graphics_Dwm",
  # capture/snap.rs: a discarded snap's files go to the Recycle Bin (SHFileOperationW, FOF_ALLOWUNDO)
  "Win32_UI_Shell",
  # island.rs card_drag_win.rs: a card dragged into another app (OLE: the shell's data object, the drag image)
  "Win32_UI_Shell_Common", "Win32_System_SystemServices", "Win32_Graphics_Imaging", "Win32_System_Com_StructuredStorage",
  "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Foundation_Collections", "Globalization",
  # remote.rs (remote_firewall.rs): whether Windows Defender Firewall lets phones in (INetFwPolicy2, no admin needed)
  "Win32_NetworkManagement_WindowsFirewall",
] }
cpal = "0.16"
# #[implement(IDropSource)] (card_drag_win.rs) expands to windows_core paths
windows-core = "0.62"
# lib.rs browser_ui_off: WebView2's own reload / find / print keys and (overlays) its Back / Refresh menu off;
# folder_drop.rs: the paths of folders dropped from Explorer (ICoreWebView2File); already in the tree through wry
webview2-com = "0.39"
# a card dragged out of the island: an OLE file drag other apps take (chat, editors, Explorer)
drag = "2.1.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland: global shortcuts through the xdg-desktop-portal GlobalShortcuts interface (GNOME 48+, KDE 5.27+).
# Dictation and capture (docs/design/linux-port.md): RemoteDesktop presses paste, ScreenCast records,
# Screenshot snaps; the host app registers its id first so the dialogs say "Blurt".
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts", "remote_desktop", "screencast", "screenshot"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# AT-SPI (which app and field a take goes into) over its own bus; already in the tree through ashpd
zbus = { version = "5", default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
# the microphone (ALSA's default → PipeWire through pipewire-alsa)
cpal = "0.16"
# the clipboard before Remote Desktop access is given: XWayland's, which GNOME syncs (already in the tree)
arboard = { version = "3", default-features = false }
# the main window's X11 id, a portal dialog's parent (mainwin.rs x11_id; already in the tree through tauri)
raw-window-handle = "0.6"
# the ScreenCast fd made inheritable for record.py (capture/portal_linux.rs)
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

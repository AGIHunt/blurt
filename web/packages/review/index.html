<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>blurt · Review</title>
<link rel="icon" href="icon.png">
<script>/* theme + platform before first paint (the bundle re-applies the same rules): ?theme= / ?platform= win; then the
   user's pick (browser page only); an app window always follows the system */
(function(){var d=document.documentElement,q=new URLSearchParams(location.search),app=!!window.blurtApp||location.protocol==="blurt-app:",s=null;
try{s=localStorage.getItem("blurt.theme")}catch(e){}
var t=q.get("theme");if(t!=="light"&&t!=="dark")t=(!app&&(s==="light"||s==="dark")&&s)||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
d.dataset.theme=t;var p=q.get("platform"),u=(navigator.platform+" "+navigator.userAgent).toLowerCase();
d.dataset.platform=p==="mac"||p==="win"||p==="gnome"?p:/mac|iphone|ipad/.test(u)?"mac":/win/.test(u)?"win":"gnome";
if(q.get("mode")==="item")d.classList.add("mode-item")})();</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>

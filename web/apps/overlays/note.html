<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blurt note</title>
    <link rel="stylesheet" href="./src/theme.css" />
    <link rel="stylesheet" href="./src/note.css" />
  </head>
  <body>
    <form class="bubble">
      <img class="shot" alt="" />

        <button type="button" data-a="skip"></button>
        <button type="submit" class="primary"></button>
      </div>
    </form>
    <script type="module" src="./src/note.ts"></script>
  </body>
</html>

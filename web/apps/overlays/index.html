<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blurt overlays</title>
    <style>
      /* Dev gallery: every overlay in demo mode over a busy backdrop, to see what is transparent. */
      body {
        margin: 0;
        padding: 16px;
        font: 13px system-ui, sans-serif;
        color: #eee;
        background: #333 repeating-conic-gradient(#3c3c3c 0 25%, #2e2e2e 0 50%) 0 0 / 24px 24px;
      }
      h2 {
        font-size: 13px;
        font-weight: 600;
        margin: 16px 0 6px;
      }
      iframe {
        display: block;
        border: 1px dashed rgba(255, 255, 255, 0.25);
        background: transparent;
        color-scheme: normal;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <h2>Island — open, a project current, organizing, an agent waiting</h2>
    <iframe src="./island.html?demo=1" width="1000" height="330" allowtransparency="true"></iframe>
    <h2>Island — auto: captures held by the claw</h2>
    <iframe src="./island.html?demo=auto&amp;lang=zh-Hans" width="1000" height="330" allowtransparency="true"></iframe>
    <h2>Island — recording · voice note · dropping a card</h2>
    <div class="row">
      <iframe src="./island.html?demo=rec" width="640" height="160" allowtransparency="true"></iframe>
      <iframe src="./island.html?demo=voice&amp;lang=zh-Hans" width="640" height="160" allowtransparency="true"></iframe>
    </div>
    <iframe src="./island.html?demo=drop" width="1000" height="420" allowtransparency="true"></iframe>
    <h2>Note bubble</h2>
    <iframe src="./note.html?demo=1&amp;n=3" width="440" height="360" allowtransparency="true"></iframe>
    <h2>Region picker</h2>
    <iframe src="./picker.html?demo=1&amp;last=40,40,300,200" width="900" height="420" allowtransparency="true"></iframe>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blurt region</title>
    <link rel="stylesheet" href="./src/theme.css" />
    <link rel="stylesheet" href="./src/picker.css" />
  </head>
  <body>
    <!-- the dim: everything but the hovered window or the selection (an even-odd cut-out; WebView2 clips a 100vmax box-shadow) -->
    <div class="mask"></div>
    <div class="win" hidden><span class="pill wlabel"></span></div>
    <div class="sel" hidden>
      <i class="h" data-h="0"></i><i class="h" data-h="1"></i><i class="h" data-h="2"></i><i class="h" data-h="3"></i>
      <i class="h" data-h="4"></i><i class="h" data-h="5"></i><i class="h" data-h="6"></i><i class="h" data-h="7"></i>
      <span class="pill size"></span>
    </div>
    <div class="hint glass" hidden></div>
    <div class="bar glass" hidden></div>
    <!-- the loupe: the screen as it was when the picker opened, 8× round the pointer (Loupe.swift) -->
    <canvas class="loupe" hidden></canvas>
    <script type="module" src="./src/picker.ts"></script>
  </body>
</html>

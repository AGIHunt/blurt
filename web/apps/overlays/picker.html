<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blurt region</title>
    <link rel="stylesheet" href="./src/theme.css" />
    <link rel="stylesheet" href="./src/picker.css" />
  </head>
  <body>
    <div class="mask"></div>
    <div class="sel" hidden>
      <!-- the selection outline (system.md §3.1): a dark solid under-stroke, then the brand gradient in 6 / 4 dashes,
           corner to corner across the selection; picker.ts sizes the rect and the gradient line -->
      <svg class="outline" aria-hidden="true">
        <defs>
          <linearGradient id="sel-g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100">
            <stop offset="0" style="stop-color: var(--g-green)" />
            <stop offset="0.45" style="stop-color: var(--g-mint)" />
            <stop offset="1" style="stop-color: var(--g-blue)" />
          </linearGradient>
        </defs>
        <rect class="under" x="1" y="1" width="100" height="100" />
        <rect class="dash" x="1" y="1" width="100" height="100" stroke="url(#sel-g)" />
      </svg>
      <span class="size"></span>
    </div>
    <div class="hint"></div>
    <div class="bar" hidden>
      <button data-a="last" hidden></button>
      <button data-a="full"></button>
      <button data-a="cancel"></button>
      <button data-a="ok" class="primary"></button>
    </div>
    <script type="module" src="./src/picker.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blurt HUD</title>
    <link rel="stylesheet" href="./src/theme.css" />
    <link rel="stylesheet" href="./src/hud.css" />
  </head>
  <body>
    <div class="hud" data-state="starting" data-tauri-drag-region>
      <span class="dot" aria-hidden="true"></span>
      <span class="time" aria-live="off">00:00</span>
      <span class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="sep"></span>
      <button class="btn" data-a="pause" title="Pause"></button>
      <button class="btn snap" data-a="snap" title="Snap"><b class="count"></b></button>
      <button class="btn stop" data-a="stop" title="Finish"><span class="lbl"></span></button>
      <button class="btn discard" data-a="discard" title="Discard"></button>
      <span class="msg" role="status"></span>
    </div>
    <script type="module" src="./src/hud.ts"></script>
  </body>
</html>

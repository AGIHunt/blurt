<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blurt HUD</title>
    <link rel="stylesheet" href="./src/theme.css" />
    <link rel="stylesheet" href="./src/hud.css" />
  </head>
  <body>
    <div class="hud" data-state="starting" data-tauri-drag-region>
      <span class="dot" aria-hidden="true"></span>
      <span class="time" aria-live="off">00:00</span>
      <span class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="sep"></span>
      <button class="btn" data-a="pause" title="Pause"><svg viewBox="0 0 16 16"><path class="i-pause" d="M4.5 3h2.2v10H4.5zM9.3 3h2.2v10H9.3z"/><path class="i-play" d="M5 2.8v10.4L13.4 8z"/></svg></button>
      <button class="btn snap" data-a="snap" title="Snap"><svg viewBox="0 0 16 16"><path d="M5.6 3.2 6.6 2h2.8l1 1.2H13a1.5 1.5 0 0 1 1.5 1.5v7.1A1.5 1.5 0 0 1 13 13.3H3a1.5 1.5 0 0 1-1.5-1.5V4.7A1.5 1.5 0 0 1 3 3.2zM8 11.4a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg><b class="count"></b></button>
      <button class="btn stop" data-a="stop" title="Finish"><svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1.6"/></svg><span class="lbl"></span></button>
      <button class="btn discard" data-a="discard" title="Discard"><svg viewBox="0 0 16 16"><path d="M4.2 3.1 8 6.9l3.8-3.8 1.1 1.1L9.1 8l3.8 3.8-1.1 1.1L8 9.1l-3.8 3.8-1.1-1.1L6.9 8 3.1 4.2z"/></svg></button>
      <span class="msg" role="status"></span>
    </div>
    <script type="module" src="./src/hud.ts"></script>
  </body>
</html>

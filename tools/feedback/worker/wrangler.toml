# Blurt feedback reports (docs/design/feedback.md). Free plan only: Workers KV + one SQLite-backed Durable Object,
# both with hard limits, so nothing can be billed. Deploy steps: README.md next to this file.
name = "blurt-feedback"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false          # only the custom domain: no *.workers.dev URL
preview_urls = false

routes = [{ pattern = "blurt-feedback.agihunt.info", custom_domain = true }]

# the reports' parts and manifests; every key expires after 14 days (the Worker sets expirationTtl)
[[kv_namespaces]]
binding = "REPORTS"
id = "c5de266b8c0f4962b05d34656a0cfdb7"   # `wrangler kv namespace create blurt-feedback` printed it

# the day's allowance and which parts are in (one instance, "global")
[[durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Budget"]

# Workers Rate Limiting API: 5 new reports a minute per key (the Worker keys on CF-Connecting-IP and stores nothing).
# namespace_id: any integer unique among this account's rate limiters.
[[ratelimits]]
name = "UPLOADS"
namespace_id = "4101"
simple = { limit = 5, period = 60 }

# secret, set with `wrangler secret put ADMIN_TOKEN` (never in this file): the admin routes' bearer token

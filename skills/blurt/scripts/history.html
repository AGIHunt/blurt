*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}a{color:var(--accent)}.top{position:sticky;top:0;z-index:10;background:var(--bg);height:58px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px;font-weight:700}.logo{width:30px;height:30px;object-fit:contain}.brand small{font-weight:500;color:var(--mute)}.sp{flex:1}.sync{font-size:12px;color:var(--mute)}.icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:34px;height:34px}.layout{display:grid;grid-template-columns:248px minmax(0,1fr);height:calc(100vh - 58px)}aside{overflow:auto;padding:20px 12px}.sidebar-title{font-size:11px;font-weight:650;letter-spacing:.08em;color:var(--faint);padding:0 10px 12px}.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:12px;outline:none}.search:focus{border-color:var(--accent)}.record{display:block;text-align:left;width:100%;background:transparent;border:1px solid transparent;border-radius:10px;padding:12px;color:var(--ink-2);margin:5px 0}.record:hover{background:var(--panel)}.record.active{background:var(--panel-2);border-color:var(--line-2)}.record.active strong{color:var(--ink)}.record small{display:block;color:var(--faint);font-size:11px}.record strong{display:block;font-size:13px;line-height:1.5;font-weight:600;margin:6px 0 10px}.record.active small{color:var(--accent)}article{overflow:auto;background:var(--bg-2);border-radius:18px 0 0 0;padding:30px 32px 60px}.heading{max-width:1400px;margin:auto}.eyebrow{display:flex;gap:12px;align-items:center;color:var(--mute);font-size:12px}h1{font-size:26px;letter-spacing:-.025em;line-height:1.4;margin:10px 0}h2{font-size:15px;letter-spacing:-.01em;margin:0 0 12px}h3{font-size:14px;margin:0 0 10px}p{margin:8px 0 12px}.muted{color:var(--mute)}.path{font-size:12px;overflow-wrap:anywhere;color:var(--mute)}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 9px;font-size:11px;background:var(--panel-2);color:var(--mute);border:1px solid var(--line)}.badge:before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}.badge.review,.badge.reviewing,.badge.reviewed{background:var(--accent-soft);color:var(--accent);border-color:transparent}.badge.completed{background:var(--keep-soft);color:var(--keep)}.badge.processing,.badge.running{background:var(--amber-soft);color:var(--amber)}.badge.failed,.badge.interrupted{background:var(--drop-soft);color:var(--drop)}.flow{display:flex;gap:0;margin:26px 0}.step{flex:1;position:relative;font-size:12px;color:var(--faint);display:flex;align-items:center;gap:9px}.step:after{content:'';height:1px;background:var(--line-2);flex:1;margin:0 14px}.step:last-child:after{display:none}.step span{width:24px;height:24px;border:1px solid var(--line-2);border-radius:50%;display:grid;place-items:center;font:11px var(--mono)}.step.on{color:var(--ink-2)}.step.on span{color:var(--keep);border-color:var(--keep);background:var(--keep-soft)}.step.now{color:var(--accent)}.step.now span{background:var(--accent);border-color:var(--accent);color:white}.content-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;max-width:1400px;margin:auto;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}.hero{border-color:var(--line-2);background:radial-gradient(600px 200px at 0 0,var(--accent-soft),transparent),var(--panel)}.hero-line{display:flex;gap:12px;align-items:center}.hero-icon{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:18px;flex:none}.hero h2{font-size:18px;margin:0}.hero p{font-size:13px;color:var(--mute)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--panel);padding:8px 13px;border-radius:10px;font-size:12.5px;font-weight:600;text-decoration:none;transition:border-color .15s}.btn:hover{border-color:var(--mute)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 20px -8px rgba(255,92,61,.5)}.btn.ghost{border-color:transparent;background:transparent;color:var(--mute)}.btn.small{padding:5px 9px;font-size:11px}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.full{width:100%}.stats{display:flex;gap:20px;padding:12px 0 17px;border-bottom:1px solid var(--line);margin-bottom:8px}.stats b{font:600 22px var(--mono);margin-right:6px}.stats small{font-size:11px;color:var(--mute)}.keep{color:var(--keep)}.drop{color:var(--drop)}.item{padding:14px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item summary{display:flex;align-items:center;gap:9px;list-style:none;font-size:13px;cursor:pointer}.item summary:before{content:'›';color:var(--faint)}.item[open] summary:before{transform:rotate(90deg)}.item .kind{font-size:10px;color:var(--mute);border:1px solid var(--line-2);border-radius:5px;padding:1px 5px;white-space:nowrap}.item .decision{font-size:11px;color:var(--keep);margin-left:auto;white-space:nowrap}.item.deleted .decision{color:var(--drop)}.item.deleted strong{text-decoration:line-through;color:var(--faint)}.item p{font-size:13px;color:var(--ink-2);padding-left:16px}.item .actions{margin:10px 0 0 16px}summary{cursor:pointer}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:0 0 15px;padding-bottom:10px}.tabs button{border:0;background:none;color:var(--mute);padding:6px 10px;font-size:12px;border-radius:7px}.tabs button.on{background:var(--panel-2);color:var(--ink);font-weight:600}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto;background:var(--bg);color:var(--ink-2);border:1px solid var(--line);padding:16px;border-radius:10px;font:11px/1.7 var(--mono);margin:12px 0}.result{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;color:var(--ink-2)}.prose{white-space:normal}.prose p{margin:8px 0}.prose .result-bullet{margin:3px 0;color:var(--mute)}.prose code{font-family:var(--mono);background:var(--panel-2);padding:2px 4px;border-radius:4px}.empty{padding:45px 16px;text-align:center;color:var(--mute);font-size:13px}.side-panel label{display:block;color:var(--mute);font-size:11px;margin:15px 0 6px}.side-panel input,.side-panel textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);padding:10px;border-radius:9px;outline:none;font-size:12px}.side-panel input:focus,.side-panel textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.side-panel textarea{min-height:108px;resize:vertical}.side-panel .hint{font-size:11px;color:var(--faint);margin:8px 0 15px}.section-caption{font:600 10px var(--mono);letter-spacing:.12em;color:var(--faint);margin-bottom:10px}.check-line{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12px;margin:14px 0}.check-line input{accent-color:var(--accent)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:10px;background:var(--panel);border:1px solid var(--line-2);box-shadow:var(--shadow);z-index:30}.toast.error{color:var(--drop)}.toast.success{color:var(--keep)}.pulse{animation:pulse 1.7s infinite}@keyframes pulse{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}@media(min-width:1400px){article{padding-left:48px;padding-right:48px}}@media(max-width:1050px){.content-grid{grid-template-columns:minmax(0,1fr)}.side-column{grid-row:1}.flow .step:after{margin:0 6px}.layout{grid-template-columns:220px minmax(0,1fr)}}@media(max-width:650px){.layout{display:block;height:auto}aside{max-height:235px}article{overflow:visible;padding:20px 16px}.top .sync{display:none}.top{padding:0 14px}.flow{flex-wrap:wrap;gap:12px}.step{min-width:27%;flex:1}.step:after{display:none}h1{font-size:22px}.content-grid{display:flex;flex-direction:column}.primary-column,.side-column{width:100%}.brand small{font-size:11px}}
.record-heading{display:flex;align-items:center;gap:20px;justify-content:space-between}.record-heading h1{min-width:0}.record-heading button{flex-shrink:0}@media(max-width:650px){.record-heading{align-items:flex-start;flex-wrap:wrap;gap:8px}.record-heading h1{margin-bottom:0}}
.record-tools{flex-shrink:0;flex-wrap:nowrap}.record-tools .icon-btn{display:grid;place-items:center}
</style></head><body>
<header class="top"><div class="brand"><img class="logo" src="icon.png" alt="口喷鸡">blurt <small>/ 处理记录</small></div><div class="sp"></div><span class="sync" id="connection">正在连接…</span><button class="icon-btn" id="themeBtn" title="切换深浅主题" aria-label="切换深浅主题">◐</button></header>
<div class="layout"><aside><div class="sidebar-title">录屏工作台 <span id="recordCount"></span></div><input class="search" id="search" placeholder="搜索录屏记录" aria-label="搜索录屏记录"><div id="records"></div></aside><article id="detail"><div class="empty">正在读取处理记录…</div></article></div>
<script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};document.documentElement.dataset.theme=store.get('blurt.theme')||'dark';
const names={saved:'录屏已保存',processing:'正在整理',review:'待审核',reviewing:'审核中',reviewed:'已审核',running:'正在执行',completed:'执行已结束',failed:'处理失败',interrupted:'任务已中断'};
let selected=decodeURIComponent(location.hash.slice(1)),last='',data=null,busy=false,rows=[],jumping=false,logTab='agent',autoSeen=new Set();
const drafts={};function draft(id){if(!drafts[id]){try{drafts[id]=JSON.parse(store.get('blurt.draft.'+id)||'{}')}catch{drafts[id]={}}}return drafts[id]}
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function toast(message,type='success'){const x=document.createElement('div');x.className='toast '+type;x.textContent=message;document.body.append(x);setTimeout(()=>x.remove(),5000)}
function date(v){const d=new Date(v);return isNaN(d)?v:d.toLocaleString('zh-CN',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function choose(id){selected=id;history.replaceState(null,'','#'+id);last='';refresh()}
function badge(s){return `<span class="badge ${esc(s)}">${esc(names[s]||s)}</span>`}
function sidebar(){const q=$('#search').value.trim().toLowerCase();$('#recordCount').textContent='· '+rows.length;$('#records').innerHTML=rows.filter(r=>r.title.toLowerCase().includes(q)).map(r=>`<button class="record ${r.id===selected?'active':''}" data-id="${esc(r.id)}"><small>${esc(date(r.date))} · ${Math.floor(r.duration/60)}:${String(r.duration%60).padStart(2,'0')}</small><strong>${esc(r.title)}</strong>${badge(r.status)}</button>`).join('')||'<p class="empty">没有匹配的记录</p>'}
function hero(d){const texts={saved:['录屏已保存','可以从口喷鸡菜单选择 Codex 整理，录屏和声音都已保留。'],processing:['正在把录屏整理成条目',d.stage+'。完成后进入审核，逐条确认你的意思。'],review:['整理好了，轮到你确认','逐条保留、修改或丢弃。确认完成后，会自动回到这里选择下一步。'],reviewing:['正在审核这段录屏','审核进度会自动保存；确认完成后回到这里继续处理。'],reviewed:['审核已完成，尚未在本页启动任务','已保留 '+d.kept+' 条内容。执行要求已自动填好，点击「开始执行」即可处理，也可以先修改要求。'],running:['Codex 正在执行任务','当前任务在指定项目中运行，进展和最终结果都会保留在这里。'],completed:['执行已结束，查看结果','先查看 Agent 的完成说明与产物，再判断是否符合预期。'],failed:['处理失败，内容已保留','展开处理日志查看原因。后续任务可修改要求后重新提交。'],interrupted:['任务中断，内容已保留','后台进程已结束，尚未收到正常完成状态。请查看日志再决定是否重试。']};const [title,body]=texts[d.status]||texts.saved;return `<section class="panel hero"><div class="hero-line"><div class="hero-icon ${['processing','running'].includes(d.status)?'pulse':''}">${['failed','interrupted'].includes(d.status)?'!':d.status==='reviewed'?'✓':['processing','running'].includes(d.status)?'◌':'↗'}</div><h2>${esc(title)}</h2></div><p>${esc(body)}</p>${d.status==='review'||d.status==='reviewing'?'<button class="btn primary" data-action="review">开始 / 继续审核 →</button>':''}${d.status==='processing'?`<label class="check-line"><input type="checkbox" id="autoReview" ${store.get('blurt.autoReview')!=='off'?'checked':''}>整理完成后，自动进入审核</label>`:''}${d.status==='running'?'<button class="btn" data-action="logs">查看执行日志</button>':''}</section>`}
function items(d){return `<section class="panel"><div class="actions"><h2 style="margin:0">${d.reviewed?'审核结果':'整理条目'}</h2><span class="sp"></span><button class="btn ghost small" data-action="review">${d.reviewed?'重新审核':'逐条审核'} ↗</button></div><div class="stats"><span><b>${d.count}</b><small>条目</small></span><span><b class="keep">${d.kept}</b><small>${d.reviewed?'保留':'未丢弃'}</small></span><span><b class="drop">${d.count-d.kept}</b><small>丢弃</small></span></div>${d.items.map((i,n)=>`<details class="item ${i.status==='deleted'?'deleted':''}" data-panel="item-${n}"><summary><span class="kind">${esc({idea:'想法',note:'笔记',issue:'问题',task:'待办'}[i.kind]||i.kind)}</span><strong>${esc(i.title)}</strong><span class="decision">${i.status==='deleted'?'丢弃':i.status==='confirmed'?'保留':'待审核'}</span></summary><p>${esc(i.summary||i.actual||i.details||'')}</p>${i.expected?`<p>预期：${esc(i.expected)}</p>`:''}${i.next_steps?.length?`<p>下一步：${i.next_steps.map(esc).join('；')}</p>`:''}<div class="actions">${(i.frames||[]).map((f,n)=>`<button class="btn small" data-file="${esc(f.path)}">证据截图 ${n+1}</button>`).join('')}</div></details>`).join('')}</section>`}
function contextText(d){
 const latest=d.jobs.at(-1),project=latest?.project??d.workspace;
 const lines=['请基于以下背景继续与我对话。历史录屏和任务仅作为上下文，不代表新的执行授权。先结合我在对话中新提出的问题继续讨论；没有新问题时，请简要确认理解并询问下一步。','','# '+d.title,'','## 项目与当前状态','- 最近实际使用的项目：'+project,'- 原录屏工作区：'+d.workspace,'- 录屏时间：'+d.date,'- 当前状态：'+(names[d.status]||d.status),'- 审核：'+(d.reviewed?'已确认':'尚未完成，请勿把草稿当成已确认需求'),'- 内容：共 '+d.count+' 条；未丢弃 '+d.kept+' 条；丢弃 '+(d.count-d.kept)+' 条。','- 上下文生成时间：'+new Date().toISOString(),'','## '+(d.reviewed?'审核后的需求与决定':'尚待审核的内容')];
 for(const item of d.items||[]){if(item.status==='deleted')continue;const clean=Object.fromEntries(Object.entries(item).filter(([k])=>!k.startsWith('_')&&!['exported'].includes(k)));lines.push('','### '+(item.id||'')+' '+item.title,'```json',JSON.stringify(clean,null,2),'```')}
 const dropped=(d.items||[]).filter(i=>i.status==='deleted');if(dropped.length)lines.push('','## 已排除的内容（不要重新纳入范围）',...dropped.map(i=>'- '+i.title));
 lines.push('','## 历次任务与结果');if(!d.jobs.length)lines.push('尚未启动后续执行任务。');
 for(const j of d.jobs){lines.push('','### '+date(j.started*1000)+' · '+(names[j.status]||j.status),'- 当时的项目：'+j.project,'- 当时的任务：'+j.task,'- 需求快照：'+d.id+'/jobs/'+j.id+'/reviewed-items.json','- 完整结果：'+d.id+'/jobs/'+j.id+'/result.md','- 处理日志：'+d.id+'/jobs/'+j.id+'/agent.log','','Agent 返回的结果摘录（报告不等同于已验收）：',j.result||'尚无最终结果，请不要推断任务已完成。');if(j.artifacts?.length)lines.push('','产物位置：',...j.artifacts.map(a=>'- '+a))}
 lines.push('','## 原始材料（本机绝对路径）','- 录屏目录：'+d.id,'- 审核结果：'+d.id+'/items.json','- 逐字稿：'+d.id+'/transcript.txt','- 录屏：'+d.id+'/recording.mp4','- 整理日志：'+d.id+'/agent.log','条目中的截图路径相对于录屏目录。复制的是文本上下文；截图和视频未附加。');
 return lines.join('\n');
}
async function copyContext(){if(!selected)return;data=await api('api/session?id='+encodeURIComponent(selected));const text=contextText(data);try{if(!navigator.clipboard?.writeText)throw Error('clipboard unavailable');await navigator.clipboard.writeText(text);toast('已复制，粘贴到 Codex 对话即可继续')}catch(e){toast('复制失败，请允许浏览器访问剪贴板后重试','error')}}
function suggestedTask(d){const kept=(d.items||[]).filter(i=>i.status!=='deleted');if(!d.reviewed||!kept.length)return '';return '请处理这次录屏中已审核保留的内容：\n'+kept.map((i,n)=>(n+1)+'. '+i.title).join('\n')+'\n\n先阅读审核条目、逐字稿并查看对应截图；必要时从原始录屏抽帧核对。结合目标项目，对明确的问题和修改要求进行修复；想法与笔记先给出建议，不擅自扩大修改范围。完成后说明改动、验证结果和产物位置；不确定或无法完成的内容请明确列出。';}
function execution(d){const j=d.jobs.at(-1),active=['processing','running','reviewing'].includes(d.status),f=draft(d.id),blocked=active||!d.reviewed||d.kept===0;return `<section class="panel side-panel"><div class="section-caption">NEXT STEP</div><h2>${d.status==='running'?'任务执行中':d.jobs.length?'发起新任务':'执行任务（可选）'}</h2><p class="muted" style="font-size:12px">${d.status==='running'?'当前任务正在运行，进展与结果显示在本页。':'提交后在指定项目中执行，进展与结果显示在本页。'}</p><label for="project">目标项目</label><input id="project" value="${esc(f.project??j?.project??d.workspace)}" placeholder="已有项目文件夹的绝对路径"><p class="hint">${d.workspace.endsWith('/Blurt')?'当前是录屏文件夹；需要修改原项目时，请换成该项目路径。':'默认使用最近执行的项目，尚无执行记录则使用录屏关联项目。'}</p><label for="task">本次执行任务</label><p class="hint">已根据审核结果填写，并会附带条目、逐字稿、截图及录屏路径；可直接执行或修改要求。</p><textarea id="task" placeholder="例如：按已审核的问题修改页面，完成后给出预览。">${esc(f.task?.trim()?f.task:suggestedTask(d))}</textarea><div class="actions next-actions" style="display:flex;flex-wrap:nowrap;margin-top:16px"><button class="btn primary" style="flex:1" data-action="execute" ${blocked?'disabled':''}>${d.status==='running'?'正在执行…':d.jobs.length?'开始新任务':'开始执行'}</button></div>${active?'<p class="hint">当前流程进行中，暂不能启动新任务；仍可复制上下文。</p>':!d.reviewed?'<p class="hint">审核完成后可继续执行。</p>':d.kept===0?'<p class="hint">全部条目已丢弃，无需执行。</p>':''}</section><section class="panel"><h2>录屏信息</h2><p class="path">${esc(d.workspace)}</p><p class="muted" style="font-size:12px">${Math.floor(d.duration/60)} 分 ${d.duration%60} 秒 · ${esc(date(d.date))}</p><div class="actions"><button class="btn small" data-action="folder">打开文件夹</button>${d.count?'<button class="btn small" data-file="items.json">导出结果文件</button>':''}</div><p class="hint muted" style="font-size:11px;margin-top:16px">关闭页面不影响后台任务。可随时从菜单「处理记录与结果」回到这里。</p></section>`}
function rich(src){const inline=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((?:\/|https?:)[^)]+\)/g,'<span>$1</span>');return String(src||'').split('\n').map(line=>{const h=line.match(/^#{1,4}\s+(.*)/);if(h)return '<h3>'+inline(h[1])+'</h3>';if(/^[-*] /.test(line))return '<p class="result-bullet">• '+inline(line.slice(2))+'</p>';return line.trim()?'<p>'+inline(line)+'</p>':''}).join('')}
function jobs(d){return d.jobs.slice().reverse().map(j=>`<section class="panel"><div class="actions"><h2 style="margin:0">执行记录</h2>${badge(j.status)}<span class="sp"></span><small class="muted">${esc(date(j.started*1000))}</small></div><p>${esc(j.task)}</p><p class="path">${esc(j.project)}</p>${j.result?`<div class="result prose">${rich(j.result)}</div><div class="actions" style="margin-top:14px">${(j.artifacts||[]).filter(a=>/\.html?$/i.test(a)).map(a=>`<button class="btn primary small" data-artifact="${esc(a)}">打开 ${esc(a.split('/').pop())} ↗</button>`).join('')}</div>`:''}<details data-panel="job-${esc(j.id)}" ${j.status==='running'?'open':''}><summary style="font-size:12px;color:var(--mute);margin-top:16px">执行日志${j.exit_code!==undefined?' · 退出码 '+j.exit_code:''}</summary><pre>${esc(j.log||'正在等待 Agent 输出…')}</pre></details></section>`).join('')}
function logs(d){let content='';if(logTab==='agent')content=`<pre>${esc(d.log||'尚未开始整理')}</pre>${d.past_logs.map(x=>`<details data-panel="${esc(x.name)}"><summary>${esc(x.name)}</summary><pre>${esc(x.log)}</pre></details>`).join('')}`;if(logTab==='transcript')content=`<div class="result">${esc(d.transcript||'语音转写完成后会显示在这里')}</div>`;if(logTab==='files')content=`<div class="actions">${d.files.map(f=>`<button class="btn small" data-file="${esc(f)}">${esc(f)}</button>`).join('')}</div>`;if(logTab==='reviews')content=d.reviews.length?d.reviews.map(r=>`<p class="muted">${esc(date(r.confirmed_at*1000))} · 保留 ${r.items.filter(i=>i.status!=='deleted').length} 条，丢弃 ${r.items.filter(i=>i.status==='deleted').length} 条</p>`).join(''):'<p class="muted">新版确认记录会保留在这里。历史审核内容已在上方展示。</p>';return `<section class="panel" id="logs"><h2>处理过程</h2><div class="tabs">${[['agent','整理日志'],['transcript','逐字稿'],['reviews','审核记录'],['files','文件']].map(([k,t])=>`<button data-tab="${k}" class="${logTab===k?'on':''}">${t}</button>`).join('')}</div>${content}</section>`}
function flow(d){
 const job=d.jobs.at(-1),execStarted=!!job,organized=d.count>0||d.reviewed,reviewDone=d.reviewed;
 const states=[['录屏已保存','on'],[d.status==='processing'?'正在整理':organized?'整理已完成':d.status==='failed'&&!execStarted?'整理失败':d.status==='interrupted'&&!execStarted?'整理中断':'等待整理',d.status==='processing'?'now':organized?'on':''],[reviewDone?'审核已完成':d.status==='reviewing'?'正在审核':'等待审核',reviewDone?'on':['review','reviewing'].includes(d.status)?'now':''],[d.status==='running'?'正在执行':job?.status==='completed'?'执行已结束':job?.status==='failed'?'执行失败':job?.status==='interrupted'?'执行中断':'尚未启动执行',d.status==='running'?'now':job?.status==='completed'?'on':''],[job?.result?'结果已生成':'暂无执行结果',job?.result?'on':'']];
 return `<div class="flow">${states.map(([label,state],i)=>`<div class="step ${state}"><span>${state==='on'?'✓':i+1}</span><b>${label}</b></div>`).join('')}</div>`;
}
function render(d){data=d;$('#detail').innerHTML=`<div class="heading"><div class="eyebrow"><span>录屏 / ${esc(date(d.date))}</span>${badge(d.status)}</div><div class="record-heading"><h1>${esc(d.title)}</h1><div class="actions record-tools"><button class="btn small" id="recordCopy" data-action="copy-context" title="复制当前记录的已有内容、审核决定和执行结果">复制上下文</button><button class="icon-btn" data-action="folder" title="打开当前记录文件夹" aria-label="打开当前记录文件夹"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/><path d="M3 8h18"/></svg></button></div></div><p class="hint" style="margin:8px 0">复制包含当前记录已有的内容、审核决定与执行结果；其他对话中的处理进度暂不会同步到这里。</p>${flow(d)}</div><div class="content-grid"><div class="primary-column">${hero(d)}${jobs(d)}${d.count?items(d):''}${logs(d)}</div><div class="side-column">${execution(d)}</div></div>`}
async function review(){if(jumping)return;jumping=true;try{const d=await api('api/review',{id:selected});location.assign(d.url)}catch(e){jumping=false;toast(e.message,'error')}}
async function refresh(){if(busy||jumping)return;busy=true;try{rows=await api('api/sessions');if(!rows.some(r=>r.id===selected))selected=rows[0]?.id||'';sidebar();if(!selected){$('#detail').innerHTML='<div class="empty">录完一段想法，这里会展示它的完整处理过程。</div>';return}const d=await api('api/session?id='+encodeURIComponent(selected));if(d.status==='processing')autoSeen.add(d.id);if(d.status==='review'&&autoSeen.has(d.id)&&store.get('blurt.autoReview')!=='off'&&document.visibilityState==='visible'){autoSeen.delete(d.id);await review();return}data=d;const serialized=JSON.stringify(d);if(serialized!==last&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){const opened=new Set([...document.querySelectorAll('details[open]')].map(x=>x.dataset.panel)),scroll=$('#detail').scrollTop;render(d);document.querySelectorAll('details').forEach(x=>{if(opened.has(x.dataset.panel))x.open=true});$('#detail').scrollTop=scroll;last=serialized}$('#connection').textContent='● 已同步 · '+new Date().toLocaleTimeString('zh-CN');}catch(e){$('#connection').textContent='连接中断，正在重试';if(!last)$('#detail').textContent=e.message}finally{busy=false}}
$('#themeBtn').onclick=()=>{const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;store.set('blurt.theme',t)};$('#search').oninput=sidebar;
document.addEventListener('input',e=>{if(['project','task'].includes(e.target.id)){drafts[selected]={project:$('#project').value,task:$('#task').value};store.set('blurt.draft.'+selected,JSON.stringify(drafts[selected]));}if(e.target.id==='autoReview')store.set('blurt.autoReview',e.target.checked?'on':'off')});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.id)return choose(b.dataset.id);if(b.dataset.tab){logTab=b.dataset.tab;render(data);return}try{if(b.dataset.artifact)await api('api/artifact',{id:selected,file:b.dataset.artifact});if(b.dataset.file!==undefined)await api('api/open',{id:selected,file:b.dataset.file});if(b.dataset.action==='copy-context')await copyContext();if(b.dataset.action==='folder')await api('api/open',{id:selected});if(b.dataset.action==='review')await review();if(b.dataset.action==='logs')document.querySelector('[data-panel^="job-"]')?.scrollIntoView({behavior:'smooth'});if(b.dataset.action==='execute'){b.disabled=true;await api('api/execute',{id:selected,project:$('#project').value,task:$('#task').value});document.activeElement.blur();last='';await refresh();toast('任务已启动，进度会更新在这里')}}catch(e){toast(e.message,'error')}finally{if(b.dataset.action==='execute')b.disabled=['processing','running','reviewing'].includes(data?.status)||!data?.reviewed||data?.kept===0}});
window.addEventListener('hashchange',()=>{selected=decodeURIComponent(location.hash.slice(1));last='';refresh()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});
if(sessionStorage.getItem('blurt.reviewCompleted')===location.href){sessionStorage.removeItem('blurt.reviewCompleted');toast('审核已保存，可以复制上下文继续对话')}
refresh();setInterval(refresh,3000);
</script></body></html>

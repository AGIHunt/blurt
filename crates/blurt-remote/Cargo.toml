[package]
name = "blurt-remote"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Blurt on Windows/Linux as the host for Blurt on the phone: the remote protocol (docs/design/remote-protocol.md), the session server, and each OS's screen, encoder and input"

# Standalone crate (no [workspace] here on purpose: the Tauri app adds it as a path dependency).
#   cargo test                                       protocol + crypto against tests/remote-vectors/vectors.json, server state machine
#   cargo check --target x86_64-pc-windows-msvc      the Windows backend from a Mac
#   cargo check (in Docker, ubuntu)                  the Linux backend

[dependencies]
# core (src/*.rs, owned by the core port)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the session: X25519 ephemerals, HKDF-SHA256, HMAC proof, ChaCha20-Poly1305 seals (RustCrypto, pure Rust)
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
# the server: TCP + UDP listeners, the relay's WebSocket (wss:// with the web's roots, and plain ws://), DNS-SD
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
socket2 = { version = "0.6", features = ["all"] }
mdns-sd = "0.13"
if-addrs = "0.13"
url = "2"
gethostname = "1"

# Windows backend (src/platform/windows): capture, encode, input
[target.'cfg(windows)'.dependencies]

# Linux backend (src/platform/linux): portal ScreenCast + RemoteDesktop, PipeWire, GStreamer
[target.'cfg(target_os = "linux")'.dependencies]

[dev-dependencies]

[[example]]
name = "host"

[[example]]
name = "phone"

[package]
name = "blurt-capture-demo"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "Test harness for blurt-capture's overlays and recording (CI under xvfb, local smoke); not shipped"

# its own workspace: not part of anything the app builds
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
blurt-capture = { path = ".." }
tauri = { version = "2.12", features = ["macos-private-api", "protocol-asset"] }
serde_json = "1"
